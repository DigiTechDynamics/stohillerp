[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
# CI gate: real bugs only (syntax errors, undefined names, invalid comparisons).
# Widen this gradually (e.g. add "F401", "I", "B") as legacy code is cleaned up.
select = ["E9", "F63", "F7", "F82"]

[tool.coverage.run]
omit = ["*/migrations/*", "*/tests/*"]
