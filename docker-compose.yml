# Stohill ERP - full stack.
#   cp .env.example .env    # then set DJANGO_SECRET_KEY and POSTGRES_PASSWORD
#   docker compose up -d --build
#   open http://localhost:8080
#
# Services: db (PostgreSQL 16) -> api (Django/gunicorn) -> web (nginx + SPA),
#           scheduler (daily jobs), backup (daily database dumps)

name: stohill-erp

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-stohill_erp}
      POSTGRES_USER: ${POSTGRES_USER:-stohill}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Not published to the host: only the api service can reach it.

  api:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in .env}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,api}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-http://localhost:8080}
      # TLS terminates in front of this stack in real deployments. For a plain
      # local HTTP run, disable the redirect (see .env.example).
      DJANGO_SECURE_SSL_REDIRECT: ${DJANGO_SECURE_SSL_REDIRECT:-True}
      DATABASE_URL: postgres://${POSTGRES_USER:-stohill}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-stohill_erp}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-3}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      TIME_ZONE: ${TIME_ZONE:-Africa/Harare}
      EMAIL_BACKEND: ${EMAIL_BACKEND:-django.core.mail.backends.console.EmailBackend}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-no-reply@stohill.local}
      EMAIL_HOST: ${EMAIL_HOST:-localhost}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-True}
      PORTAL_BASE_URL: ${PORTAL_BASE_URL:-http://localhost:8080}
      PAYNOW_INTEGRATION_ID: ${PAYNOW_INTEGRATION_ID:-}
      PAYNOW_INTEGRATION_KEY: ${PAYNOW_INTEGRATION_KEY:-}
      ONLINE_PAYMENTS_BANK_ACCOUNT: ${ONLINE_PAYMENTS_BANK_ACCOUNT:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      COMPANY_NAME: ${COMPANY_NAME:-Stohill Properties}
      COMPANY_TAGLINE: ${COMPANY_TAGLINE:-}
      COMPANY_ADDRESS: ${COMPANY_ADDRESS:-}
      COMPANY_PHONE: ${COMPANY_PHONE:-}
      COMPANY_EMAIL: ${COMPANY_EMAIL:-}
      COMPANY_WEBSITE: ${COMPANY_WEBSITE:-}
      COMPANY_VAT_NUMBER: ${COMPANY_VAT_NUMBER:-}
      COMPANY_TAX_NUMBER: ${COMPANY_TAX_NUMBER:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
    volumes:
      - media:/app/media

  # Daily jobs: rental billing, late fees, depreciation, recurring journals.
  scheduler:
    build: ./backend
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    command: ["python", "manage.py", "run_scheduler", "--at", "${SCHEDULER_AT:-02:00}"]
    healthcheck:
      disable: true
    environment:
      RUN_MIGRATIONS: "0"   # the api service migrates
      DJANGO_SETTINGS_MODULE: config.settings.production
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in .env}
      DATABASE_URL: postgres://${POSTGRES_USER:-stohill}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-stohill_erp}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      TIME_ZONE: ${TIME_ZONE:-Africa/Harare}
      EMAIL_BACKEND: ${EMAIL_BACKEND:-django.core.mail.backends.console.EmailBackend}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-no-reply@stohill.local}
      EMAIL_HOST: ${EMAIL_HOST:-localhost}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-True}
      PORTAL_BASE_URL: ${PORTAL_BASE_URL:-http://localhost:8080}
      PAYNOW_INTEGRATION_ID: ${PAYNOW_INTEGRATION_ID:-}
      PAYNOW_INTEGRATION_KEY: ${PAYNOW_INTEGRATION_KEY:-}
      ONLINE_PAYMENTS_BANK_ACCOUNT: ${ONLINE_PAYMENTS_BANK_ACCOUNT:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      COMPANY_NAME: ${COMPANY_NAME:-Stohill Properties}
      COMPANY_TAGLINE: ${COMPANY_TAGLINE:-}
      COMPANY_ADDRESS: ${COMPANY_ADDRESS:-}
      COMPANY_PHONE: ${COMPANY_PHONE:-}
      COMPANY_EMAIL: ${COMPANY_EMAIL:-}
      COMPANY_WEBSITE: ${COMPANY_WEBSITE:-}
      COMPANY_VAT_NUMBER: ${COMPANY_VAT_NUMBER:-}
      COMPANY_TAX_NUMBER: ${COMPANY_TAX_NUMBER:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
    volumes:
      - media:/app/media

  # Daily database backup to BACKUP_DIR on the host, verified, kept
  # BACKUP_KEEP_DAYS days. Copy that folder off the server. See ops/backup/backup.sh.
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["sh", "/ops/backup.sh"]
    healthcheck:
      # Unhealthy if the last backup failed or none has succeeded in 26 hours.
      test: ["CMD-SHELL", "grep -q '^ok' /backups/LAST_STATUS && find /backups -maxdepth 1 -name '*.dump' -mmin -1560 | grep -q ."]
      interval: 5m
      start_period: 2m
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-stohill_erp}
      POSTGRES_USER: ${POSTGRES_USER:-stohill}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      BACKUP_AT: ${BACKUP_AT:-01:30}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      TZ: ${TIME_ZONE:-Africa/Harare}
    volumes:
      - ./ops/backup/backup.sh:/ops/backup.sh:ro
      - ${BACKUP_DIR:-./backups}:/backups

  web:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8080}:80"
    volumes:
      - media:/srv/media:ro

volumes:
  pgdata:
  media:
