# Serves the React SPA and proxies the API so the browser sees one origin:
# no CORS, and cookies/CSRF behave predictably.

upstream stohill_api {
    server api:8000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    client_max_body_size 10m;          # matches UPLOAD_MAX_BYTES on the API
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    include /etc/nginx/snippets/security-headers.conf;

    location = /healthz { access_log off; return 200 "ok\n"; }

    # API, Django admin and its static files go to gunicorn.
    location ~ ^/(api|admin|static)/ {
        proxy_pass http://stohill_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 90s;
    }

    # Private uploads (KYC, contracts, CRM attachments, inspection reports) are
    # never served directly: the API checks access and then hands the transfer
    # back with X-Accel-Redirect to /protected-media/. Keep this list in sync
    # with PRIVATE_PREFIXES in backend/utils/private_media.py.
    location ~ ^/media/(documents|crm/documents|crm/attachments|inspections)/ {
        return 404;
    }

    location /protected-media/ {
        internal;
        alias /srv/media/;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Content-Security-Policy "default-src 'none'; sandbox" always;
        add_header Cache-Control "private, no-store" always;
    }

    # Public uploads (property photos, avatars). For production at scale,
    # move media to object storage.
    location /media/ {
        alias /srv/media/;
        include /etc/nginx/snippets/security-headers.conf;
        # Never let an uploaded file render as a page on our origin.
        add_header Content-Security-Policy "default-src 'none'; sandbox" always;
    }

    # Hashed build assets never change: cache for a year.
    location /assets/ {
        expires 1y;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Everything else is a client-side route: serve index.html, never cached,
    # so users pick up new deploys immediately.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
